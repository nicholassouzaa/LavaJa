<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🫧LavaJá — Encontre sua lavação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand" onclick="showPage('home'); return false;"><span>LavaJá</span></a>
    <nav>
      <a href="#" onclick="showPage('home'); return false;">Início</a>
      <a id="clientNav" class="hidden" href="#" onclick="showPage('appointments'); return false;">Meus agendamentos</a>
      <a id="vehiclesNav" class="hidden" href="#" onclick="showPage('vehicles'); return false;">Meus veículos</a>
      <a id="companyNav" class="hidden" href="#" onclick="showPage('company'); return false;">Minha lavação</a>
      <a id="adminNav" class="hidden" href="#" onclick="showPage('admin'); return false;">Painel admin</a>
      
    </nav>
    <div id="accountArea">
      <button class="btn outline" onclick="openModal('loginModal')">Entrar</button>
      <button class="btn primary" onclick="openModal('registerModal')">Criar conta</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <b>LavaJá</b>
    <p class="muted" style="margin:6px 0 0">Encontre e agende sua lavação com facilidade.</p>
  </footer>

  <div id="toast" class="toast"></div>

  <div id="loginModal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('loginModal')">×</button>
      <h2>Entrar</h2>
      <p class="muted">Acesse sua conta</p>
      <form id="loginForm">
        <label>E-mail<input id="loginEmail" type="email" required></label>
        <label>Senha<input id="loginPassword" type="password" required></label>
        <button class="btn primary full" type="submit">Entrar</button>
      </form>
      <div class="demo">
      </div>
    </div>
  </div>

  <div id="registerModal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('registerModal')">×</button>
      <h2>Criar conta</h2>
      <p class="muted">Escolha seu perfil para começar.</p>
      <form id="registerForm">
        <label>Nome<input id="registerName" required></label>
        <label>E-mail<input id="registerEmail" type="email" required></label>
        <label>Senha<input id="registerPassword" type="password" minlength="6" required></label>
        <label>Perfil
          <select id="registerRole">
            <option value="cliente">Cliente</option>
            <option value="empresa">Empresa</option>
          </select>
        </label>
        <button class="btn primary full" type="submit">Criar conta</button>
      </form>
    </div>
  </div>

  <div id="bookingModal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('bookingModal')">×</button>
      <h2>Agendar serviço</h2>
      <div id="bookingSummary"></div>
      <form id="bookingForm">
        <input type="hidden" id="bookingWashId">
        <input type="hidden" id="bookingServiceId">
        <label>Data<input id="bookingDate" type="date" required></label>
        <label>Horário<select id="bookingTime" required></select></label>
        <label>Veículo<select id="bookingVehicleId" required><option value="">Selecione um veículo</option></select><button type="button" class="btn outline small" style="margin-top:7px" onclick="showPage('vehicles')">+ Cadastrar novo veículo</button></label><label>Telefone<input id="bookingPhone" required placeholder="(48) 99999-9999"></label>
        <button class="btn primary full" type="submit">Confirmar agendamento</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
